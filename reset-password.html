<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Arrivo</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12123B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arrivo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="booking.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand">
      <span class="logo-wrap"><img src="assets/icon.png" alt="" class="brand-mark" width="28" height="28"></span>
      <span>arrivo</span>
    </a>
  </div>
</header>

<main class="wrap booking-wrap" style="max-width: 440px;">
  <h1>Set a new password</h1>
  <div class="booking-card">
    <input type="password" id="fPassword" class="field" placeholder="New password">
    <p class="error-text" id="msg" hidden></p>
    <button class="btn btn-primary" id="submitBtn" style="width:100%;">Reset password</button>
  </div>
</main>

<script>
  var API_BASE_URL = "https://arrivo-backend-g1ku.onrender.com";

  function getToken() {
    var params = new URLSearchParams(window.location.search);
    return params.get("token");
  }

  document.getElementById("submitBtn").addEventListener("click", function () {
    var token = getToken();
    var newPassword = document.getElementById("fPassword").value;
    var msg = document.getElementById("msg");
    var btn = document.getElementById("submitBtn");

    if (!token) {
      msg.hidden = false;
      msg.style.color = "var(--coral)";
      msg.textContent = "This reset link is missing its token. Please use the link from your email.";
      return;
    }
    if (!newPassword || newPassword.length < 6) {
      msg.hidden = false;
      msg.style.color = "var(--coral)";
      msg.textContent = "Password must be at least 6 characters.";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Saving…";

    fetch(API_BASE_URL + "/api/auth/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, newPassword: newPassword }),
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        msg.hidden = false;
        msg.style.color = result.ok ? "var(--teal)" : "var(--coral)";
        msg.textContent = result.data.message || result.data.error;
        if (result.ok) {
          document.getElementById("fPassword").value = "";
          btn.textContent = "Done";
        } else {
          btn.disabled = false;
          btn.textContent = "Reset password";
        }
      })
      .catch(function () {
        msg.hidden = false;
        msg.style.color = "var(--coral)";
        msg.textContent = "Couldn't reach the server. Please try again.";
        btn.disabled = false;
        btn.textContent = "Reset password";
      });
  });
</script>
<script src="pwa-register.js"></script>
</body>
</html>
