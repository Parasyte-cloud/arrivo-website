<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password | RideArrivo</title>
<meta name="description" content="Set a new password for your RideArrivo account.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=30">
<link rel="stylesheet" href="booking.css?v=30">
<style>
  .auth-wrap { max-width: 440px; margin: 0 auto; padding: 48px 20px 60px; }
  .auth-wrap h1 { margin-bottom: 24px; }
  .auth-footer-link { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--text-muted); }
  .auth-footer-link a { color: var(--teal, var(--primary)); font-weight: 600; }
</style>
</head>
<body>

<svg style="position:absolute; width:0; height:0; overflow:hidden;" aria-hidden="true">
  <filter id="liquid-glass-refraction" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.010 0.018" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="14" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand">
      <span class="logo-wrap"><img src="assets/icon.png" alt="" class="brand-mark" width="28" height="28"></span>
      <img src="assets/ridearrivo-wordmark.png" alt="RideArrivo" class="brand-wordmark">
    </a>
  </div>
</header>

<main class="auth-wrap">
  <h1>Set a new password</h1>
  <div class="booking-card" id="resetForm">
    <input type="password" id="fPassword" class="field" placeholder="New password" autocomplete="new-password">
    <input type="password" id="fPasswordConfirm" class="field" placeholder="Confirm new password" autocomplete="new-password">
    <p class="error-text" id="resetError" hidden></p>
    <button type="button" class="btn btn-primary" id="resetBtn" style="width:100%;">Update password</button>
  </div>
  <div class="booking-card" id="successMessage" hidden>
    <p style="margin:0 0 14px;">Password updated. You can now log in with your new password.</p>
    <a href="login.html" class="btn btn-primary" style="width:100%;text-align:center;text-decoration:none;">Log in</a>
  </div>
  <div class="booking-card" id="noTokenMessage" hidden>
    <p style="margin:0;">This reset link is missing its token. Please request a new one from the <a href="forgot-password.html" style="color:var(--teal, var(--primary));">forgot password page</a>.</p>
  </div>
</main>

<script>
  var API_BASE_URL = "https://arrivo-backend-g1ku.onrender.com";

  function api(path, options) {
    options = options || {};
    return fetch(API_BASE_URL + path, options).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { ok: res.ok, status: res.status, data: data };
      });
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    var token = new URLSearchParams(window.location.search).get("token");
    if (!token) {
      document.getElementById("resetForm").hidden = true;
      document.getElementById("noTokenMessage").hidden = false;
      return;
    }

    var errEl = document.getElementById("resetError");
    var btn = document.getElementById("resetBtn");

    btn.addEventListener("click", function () {
      var password = document.getElementById("fPassword").value;
      var confirm = document.getElementById("fPasswordConfirm").value;
      errEl.hidden = true;

      if (!password || password.length < 6) {
        errEl.hidden = false;
        errEl.textContent = "Password must be at least 6 characters.";
        return;
      }
      if (password !== confirm) {
        errEl.hidden = false;
        errEl.textContent = "Passwords don't match.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Updating…";
      api("/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token, newPassword: password }),
      }).then(function (result) {
        btn.disabled = false;
        btn.textContent = "Update password";
        if (!result.ok) {
          errEl.hidden = false;
          errEl.textContent = result.data.error || "Something went wrong. Please try again.";
          return;
        }
        document.getElementById("resetForm").hidden = true;
        document.getElementById("successMessage").hidden = false;
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = "Update password";
        errEl.hidden = false;
        errEl.textContent = "Couldn't reach the server. Please try again.";
      });
    });
  });
</script>
<script src="glass-effects.js?v=30"></script>
</body>
</html>
