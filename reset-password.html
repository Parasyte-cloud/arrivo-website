<script>
  // Theme first paint: saved choice, else the device setting. Runs before the
  // stylesheets so there is no flash of the wrong theme.
  (function () {
    var t = "light";
    try {
      // The choice is also kept in a cookie shared by every *.ridearrivo.com
      // site, so it follows the rider from the website to Express and back.
      // A ?theme= in the link (added by the site you came from) wins, then the
      // shared cookie, then this site's own saved choice.
      var q = location.search.match(/[?&]theme=(light|dark)(?:&|$)/);
      var m = document.cookie.match(/(?:^|; )arrivo_theme=(light|dark)/);
      var saved = q ? q[1] : (m ? m[1] : localStorage.getItem("arrivo_theme"));
      if (saved === "light" || saved === "dark") t = saved;
      else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
    } catch (e) {}
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>

<main class="auth-wrap" id="main">
  <h1 data-i18n="auth.setNew">Set a new password</h1>
  <div class="booking-card" id="resetForm">
    <input type="password" id="fPassword" class="field" placeholder="New password" data-i18n-placeholder="auth.newPassword" autocomplete="new-password">
    <input type="password" id="fPasswordConfirm" class="field" placeholder="Confirm new password" data-i18n-placeholder="auth.confirmNew" autocomplete="new-password">
    <p class="error-text" id="resetError" hidden></p>
    <button type="button" class="btn btn-primary" id="resetBtn" style="width:100%;" data-i18n="auth.updatePw">Update password</button>
  </div>
  <div class="booking-card" id="successMessage" hidden>
    <p style="margin:0 0 14px;" data-i18n="auth.pwUpdated">Password updated. You can now log in with your new password.</p>
    <a href="login.html" class="btn btn-primary" style="width:100%;text-align:center;text-decoration:none;" data-i18n="auth.logIn">Log in</a>
  </div>
  <div class="booking-card" id="noTokenMessage" hidden>
    <p style="margin:0;" data-i18n="auth.noToken">This reset link is missing its token. Please request a new one from the <a href="forgot-password.html" style="color:var(--primary);text-decoration:underline;">forgot password page</a>.</p>
  </div>
</main>

<script>
  var API_BASE_URL = "https://api.ridearrivo.com";

  function api(path, options) {
    options = options || {};
    return fetch(API_BASE_URL + path, options).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { ok: res.ok, status: res.status, data: data };
      });
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    var token = new URLSearchParams(window.location.search).get("token");
    if (!token) {
      document.getElementById("resetForm").hidden = true;
      document.getElementById("noTokenMessage").hidden = false;
      return;
    }

    var errEl = document.getElementById("resetError");
    var btn = document.getElementById("resetBtn");

    btn.addEventListener("click", function () {
      var password = document.getElementById("fPassword").value;
      var confirm = document.getElementById("fPasswordConfirm").value;
      errEl.hidden = true;

      if (!password || password.length < 8) {
        errEl.hidden = false;
        errEl.textContent = RAt("auth.errPw8","Password must be at least 8 characters.");
        return;
      }
      if (password !== confirm) {
        errEl.hidden = false;
        errEl.textContent = RAt("auth.errMatch","Passwords don't match.");
        return;
      }

      btn.disabled = true;
      btn.textContent = RAt("auth.updating","Updating…");
      api("/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token, newPassword: password }),
      }).then(function (result) {
        btn.disabled = false;
        btn.textContent = RAt("auth.updatePw","Update password");
        if (!result.ok) {
          errEl.hidden = false;
          errEl.textContent = result.data.error || "Something went wrong. Please try again.";
          return;
        }
        document.getElementById("resetForm").hidden = true;
        document.getElementById("successMessage").hidden = false;
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = RAt("auth.updatePw","Update password");
        errEl.hidden = false;
        errEl.textContent = RAt("auth.errServer","Couldn't reach the server. Please try again.");
      });
    });
  });
</script>
