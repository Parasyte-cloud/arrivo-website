<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a profile | RideArrivo</title>
<meta name="description" content="Create your RideArrivo profile to book airport pickups and rides across Lagos.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=30">
<link rel="stylesheet" href="booking.css?v=30">
<style>
  .auth-wrap { max-width: 460px; margin: 0 auto; padding: 48px 20px 60px; }
  .auth-wrap h1 { margin-bottom: 24px; }
  .auth-footer-link { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--text-muted); }
  .auth-footer-link a { color: var(--teal, var(--primary)); font-weight: 600; }
</style>
</head>
<body>

<svg style="position:absolute; width:0; height:0; overflow:hidden;" aria-hidden="true">
  <filter id="liquid-glass-refraction" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.010 0.018" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="14" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand">
      <span class="logo-wrap"><img src="assets/icon.png" alt="" class="brand-mark" width="28" height="28"></span>
      <span><span class="brand-ride">Ride</span><span class="brand-arrivo">Arrivo</span></span>
    </a>
  </div>
</header>

<main class="auth-wrap">
  <h1>Create a profile</h1>
  <div class="booking-card">
    <input type="text" id="fFirstName" class="field" placeholder="First name" autocomplete="given-name">
    <input type="text" id="fLastName" class="field" placeholder="Last name" autocomplete="family-name">
    <input type="email" id="fEmail" class="field" placeholder="Email" autocomplete="email">
    <label class="field-label">WhatsApp number</label>
    <div id="signupPhoneContainer" style="margin-bottom:14px;"></div>
    <input type="text" id="fCountry" class="field" placeholder="Country of residence" autocomplete="country-name">
    <input type="password" id="fPassword" class="field" placeholder="Password" autocomplete="new-password">
    <input type="password" id="fPasswordConfirm" class="field" placeholder="Confirm password" autocomplete="new-password">

    <label class="checkbox-row">
      <input type="checkbox" id="fAgree">
      <span>I agree to <span class="brand-ride">Ride</span><span class="brand-arrivo">Arrivo</span>'s <a href="privacy.html" target="_blank" style="color:var(--teal, var(--primary));text-decoration:underline;">privacy policy</a> and <a href="terms.html" target="_blank" style="color:var(--teal, var(--primary));text-decoration:underline;">terms of service</a>.</span>
    </label>

    <p class="error-text" id="signupError" hidden></p>
    <button type="button" class="btn btn-primary" id="signupBtn" style="width:100%;margin-top:6px;">Create profile</button>
  </div>
  <p class="auth-footer-link">Already have a profile? <a href="login.html">Log in</a>.</p>
</main>

<script src="phone-input.js?v=30"></script>
<script>
  var API_BASE_URL = "https://arrivo-backend-g1ku.onrender.com";
  var TOKEN_KEY = "arrivo_rider_token";

  function api(path, options) {
    options = options || {};
    return fetch(API_BASE_URL + path, options).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { ok: res.ok, status: res.status, data: data };
      });
    });
  }

  function getNextUrl() {
    var params = new URLSearchParams(window.location.search);
    return params.get("next") || "account.html";
  }

  document.addEventListener("DOMContentLoaded", function () {
    if (localStorage.getItem(TOKEN_KEY)) {
      window.location.href = getNextUrl();
      return;
    }

    var phoneField = arrivoBuildPhoneInput(document.getElementById("signupPhoneContainer"), { placeholder: "WhatsApp number" });
    var errEl = document.getElementById("signupError");
    var btn = document.getElementById("signupBtn");

    btn.addEventListener("click", function () {
      var firstName = document.getElementById("fFirstName").value.trim();
      var lastName = document.getElementById("fLastName").value.trim();
      var email = document.getElementById("fEmail").value.trim();
      var country = document.getElementById("fCountry").value.trim();
      var password = document.getElementById("fPassword").value;
      var passwordConfirm = document.getElementById("fPasswordConfirm").value;
      var agreed = document.getElementById("fAgree").checked;
      errEl.hidden = true;

      var phoneResult = phoneField.getValue();

      if (!firstName || !lastName || !email) {
        errEl.hidden = false; errEl.textContent = "Please fill in your name and email."; return;
      }
      if (!phoneResult.valid) {
        errEl.hidden = false; errEl.textContent = phoneResult.message; return;
      }
      if (!password || password.length < 8) {
        errEl.hidden = false; errEl.textContent = "Password must be at least 8 characters."; return;
      }
      if (password !== passwordConfirm) {
        errEl.hidden = false; errEl.textContent = "Passwords don't match."; return;
      }
      if (!agreed) {
        errEl.hidden = false; errEl.textContent = "Please agree to the privacy policy and terms of service."; return;
      }

      btn.disabled = true;
      btn.textContent = "Creating your profile…";

      api("/api/auth/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          firstName: firstName, lastName: lastName, email: email, password: password, confirmPassword: passwordConfirm,
          whatsappNumber: phoneResult.full, countryOfResidence: country || null, agreedToTerms: agreed, role: "rider",
        }),
      }).then(function (result) {
        btn.disabled = false;
        btn.textContent = "Create profile";
        if (!result.ok) {
          errEl.hidden = false;
          errEl.textContent = result.data.error || "Couldn't create your profile. Please try again.";
          return;
        }
        localStorage.setItem(TOKEN_KEY, result.data.token);
        window.location.href = getNextUrl();
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = "Create profile";
        errEl.hidden = false;
        errEl.textContent = "Couldn't reach the server. Please try again.";
      });
    });
  });
</script>
<script src="glass-effects.js?v=30"></script>
</body>
</html>
