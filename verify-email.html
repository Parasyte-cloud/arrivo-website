<script>
  // Theme first paint: saved choice, else the device setting. Runs before the
  // stylesheets so there is no flash of the wrong theme.
  (function () {
    var t = "light";
    try {
      // The choice is also kept in a cookie shared by every *.ridearrivo.com
      // site, so it follows the rider from the website to Express and back.
      // A ?theme= in the link (added by the site you came from) wins, then the
      // shared cookie, then this site's own saved choice.
      var q = location.search.match(/[?&]theme=(light|dark)(?:&|$)/);
      var m = document.cookie.match(/(?:^|; )arrivo_theme=(light|dark)/);
      var saved = q ? q[1] : (m ? m[1] : localStorage.getItem("arrivo_theme"));
      if (saved === "light" || saved === "dark") t = saved;
      else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
    } catch (e) {}
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>

  </div>
</main>

<script>
  var API_BASE_URL = "https://api.ridearrivo.com";

  function getToken() {
    var params = new URLSearchParams(window.location.search);
    return params.get("token");
  }

  var token = getToken();
  var statusMsg = document.getElementById("statusMsg");
  var continueBtn = document.getElementById("continueBtn");

  if (!token) {
    statusMsg.className = "status-bad";
    statusMsg.textContent = (window.RAt?RAt("auth.errNoToken","This verification link is missing its token."):"This verification link is missing its token.");
  } else {
    // Take the one-time token out of the address bar so it does not sit in
    // history or get copied along with the page link.
    try { window.history.replaceState(null, "", window.location.pathname); } catch (e) {}
    fetch(API_BASE_URL + "/api/auth/verify-email", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token }),
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        statusMsg.className = result.ok ? "status-ok" : "status-bad";
        statusMsg.textContent = result.data.message || result.data.error || (result.ok
          ? ""
          : (window.RAt?RAt("auth.errServer","Couldn't reach the server. Please try again."):"Couldn't reach the server. Please try again."));
        if (result.ok) continueBtn.style.display = "block";
      })
      .catch(function () {
        statusMsg.className = "status-bad";
        statusMsg.textContent = (window.RAt?RAt("auth.errServer","Couldn't reach the server. Please try again."):"Couldn't reach the server. Please try again.");
      });
  }
</script>
