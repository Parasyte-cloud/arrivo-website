<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password | RideArrivo</title>
<meta name="description" content="Reset your RideArrivo account password.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=30">
<link rel="stylesheet" href="booking.css?v=30">
<style>
  .auth-wrap { max-width: 440px; margin: 0 auto; padding: 48px 20px 60px; }
  .auth-wrap h1 { margin-bottom: 12px; }
  .auth-wrap p.lead { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
  .auth-footer-link { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--text-muted); }
  .auth-footer-link a { color: var(--teal, var(--primary)); font-weight: 600; }
</style>
</head>
<body>

<svg style="position:absolute; width:0; height:0; overflow:hidden;" aria-hidden="true">
  <filter id="liquid-glass-refraction" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.010 0.018" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="14" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand">
      <span class="logo-wrap"><img src="assets/icon.png" alt="" class="brand-mark" width="28" height="28"></span>
      <span><span class="brand-ride">Ride</span><span class="brand-arrivo">Arrivo</span></span>
    </a>
  </div>
</header>

<main class="auth-wrap">
  <h1>Forgot your password?</h1>
  <p class="lead">Enter the email on your account and we'll send you a link to set a new password.</p>
  <div class="booking-card" id="requestForm">
    <input type="email" id="fEmail" class="field" placeholder="Email address" autocomplete="email">
    <p class="error-text" id="requestError" hidden></p>
    <button type="button" class="btn btn-primary" id="requestBtn" style="width:100%;">Send reset link</button>
  </div>
  <div class="booking-card" id="successMessage" hidden>
    <p style="margin:0;">If an account exists for that email, a reset link has been sent. Check your inbox.</p>
  </div>
  <p class="auth-footer-link"><a href="login.html">Back to log in</a></p>
</main>

<script>
  var API_BASE_URL = "https://arrivo-backend-g1ku.onrender.com";

  function api(path, options) {
    options = options || {};
    return fetch(API_BASE_URL + path, options).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { ok: res.ok, status: res.status, data: data };
      });
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    var errEl = document.getElementById("requestError");
    var btn = document.getElementById("requestBtn");

    btn.addEventListener("click", function () {
      var email = document.getElementById("fEmail").value.trim();
      errEl.hidden = true;
      if (!email) {
        errEl.hidden = false;
        errEl.textContent = "Please enter your email address.";
        return;
      }
      btn.disabled = true;
      btn.textContent = "Sending…";
      api("/api/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email }),
      }).then(function (result) {
        btn.disabled = false;
        btn.textContent = "Send reset link";
        if (!result.ok) {
          errEl.hidden = false;
          errEl.textContent = result.data.error || "Something went wrong. Please try again.";
          return;
        }
        document.getElementById("requestForm").hidden = true;
        document.getElementById("successMessage").hidden = false;
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = "Send reset link";
        errEl.hidden = false;
        errEl.textContent = "Couldn't reach the server. Please try again.";
      });
    });
  });
</script>
<script src="glass-effects.js?v=30"></script>
</body>
</html>
