<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — Arrivo</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="booking.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand">
      <span class="logo-wrap"><img src="assets/icon.svg" alt="" class="brand-mark" width="28" height="28"></span>
      <span>arrivo</span>
    </a>
  </div>
</header>

<main class="wrap booking-wrap" style="max-width: 440px;">
  <h1>Forgot your password?</h1>
  <div class="booking-card">
    <p style="color: var(--text-muted); font-size: 13.5px; margin-bottom: 20px;">
      Enter the email on your Arrivo account and we'll send you a link to reset your password.
    </p>
    <input type="email" id="fEmail" class="field" placeholder="you@example.com">
    <p class="error-text" id="msg" hidden></p>
    <button class="btn btn-primary" id="submitBtn" style="width:100%;">Send reset link</button>
  </div>
</main>

<script>
  var API_BASE_URL = "https://arrivo-backend-g1ku.onrender.com";

  document.getElementById("submitBtn").addEventListener("click", function () {
    var email = document.getElementById("fEmail").value.trim();
    var msg = document.getElementById("msg");
    var btn = document.getElementById("submitBtn");
    if (!email) return;

    btn.disabled = true;
    btn.textContent = "Sending…";

    fetch(API_BASE_URL + "/api/auth/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email }),
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        msg.hidden = false;
        msg.style.color = "var(--teal)";
        msg.textContent = data.message || "If an account exists for that email, a reset link has been sent.";
      })
      .catch(function () {
        msg.hidden = false;
        msg.style.color = "var(--coral)";
        msg.textContent = "Couldn't reach the server. Please try again.";
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "Send reset link";
      });
  });
</script>
</body>
</html>
