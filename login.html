<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | RideArrivo</title>
<meta name="description" content="Log in to your RideArrivo account.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=30">
<link rel="stylesheet" href="booking.css?v=30">
<style>
  .auth-wrap { max-width: 440px; margin: 0 auto; padding: 48px 20px 60px; }
  .auth-wrap h1 { margin-bottom: 24px; }
  .auth-card { }
  .auth-footer-link { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--text-muted); }
  .auth-footer-link a { color: var(--teal, var(--primary)); font-weight: 600; }
</style>
</head>
<body>

<svg style="position:absolute; width:0; height:0; overflow:hidden;" aria-hidden="true">
  <filter id="liquid-glass-refraction" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.010 0.018" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="14" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand">
      <span class="logo-wrap"><img src="assets/icon.png" alt="" class="brand-mark" width="28" height="28"></span>
      <span><span class="brand-ride">Ride</span><span class="brand-arrivo">Arrivo</span></span>
    </a>
  </div>
</header>

<main class="auth-wrap">
  <h1>Log in</h1>
  <div class="booking-card auth-card">
    <input type="email" id="fEmail" class="field" placeholder="Email address" autocomplete="email">
    <input type="password" id="fPassword" class="field" placeholder="Password" autocomplete="current-password">
    <p class="error-text" id="loginError" hidden></p>
    <button type="button" class="btn btn-primary" id="loginBtn" style="width:100%;">Log in</button>
    <p style="text-align:center; margin-top:14px;">
      <a href="forgot-password.html" style="font-size:13px; color:var(--teal, var(--primary));">Forgot your password?</a>
    </p>
  </div>
  <p class="auth-footer-link">New to RideArrivo? <a href="signup.html">Create a profile</a>.</p>
</main>

<script>
  var API_BASE_URL = "https://arrivo-backend-g1ku.onrender.com";
  var TOKEN_KEY = "arrivo_rider_token";

  function api(path, options) {
    options = options || {};
    return fetch(API_BASE_URL + path, options).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { ok: res.ok, status: res.status, data: data };
      });
    });
  }

  function getNextUrl() {
    var params = new URLSearchParams(window.location.search);
    return params.get("next") || "account.html";
  }

  document.addEventListener("DOMContentLoaded", function () {
    // Already logged in? Skip straight past this page.
    if (localStorage.getItem(TOKEN_KEY)) {
      window.location.href = getNextUrl();
      return;
    }

    var errEl = document.getElementById("loginError");
    var btn = document.getElementById("loginBtn");

    function attemptLogin() {
      var email = document.getElementById("fEmail").value.trim();
      var password = document.getElementById("fPassword").value;
      errEl.hidden = true;

      if (!email || !password) {
        errEl.hidden = false;
        errEl.textContent = "Please enter your email and password.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Logging in…";

      api("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password }),
      }).then(function (result) {
        btn.disabled = false;
        btn.textContent = "Log in";
        if (!result.ok) {
          errEl.hidden = false;
          errEl.textContent = result.data.error || "Couldn't log in. Check your email and password.";
          return;
        }
        localStorage.setItem(TOKEN_KEY, result.data.token);
        window.location.href = getNextUrl();
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = "Log in";
        errEl.hidden = false;
        errEl.textContent = "Couldn't reach the server. Please try again.";
      });
    }

    btn.addEventListener("click", attemptLogin);
    document.getElementById("fPassword").addEventListener("keydown", function (e) {
      if (e.key === "Enter") attemptLogin();
    });
  });
</script>
<script src="glass-effects.js?v=30"></script>
</body>
</html>
