<script>
  // Theme first paint: saved choice, else the device setting. Runs before the
  // stylesheets so there is no flash of the wrong theme.
  (function () {
    var t = "light";
    try {
      // The choice is also kept in a cookie shared by every *.ridearrivo.com
      // site, so it follows the rider from the website to Express and back.
      // A ?theme= in the link (added by the site you came from) wins, then the
      // shared cookie, then this site's own saved choice.
      var q = location.search.match(/[?&]theme=(light|dark)(?:&|$)/);
      var m = document.cookie.match(/(?:^|; )arrivo_theme=(light|dark)/);
      var saved = q ? q[1] : (m ? m[1] : localStorage.getItem("arrivo_theme"));
      if (saved === "light" || saved === "dark") t = saved;
      else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
    } catch (e) {}
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>

<script>
  var API_BASE_URL = "https://api.ridearrivo.com";
  var TOKEN_KEY = "arrivo_rider_token";

  function api(path, options) {
    options = options || {};
    // credentials:"include" lets the browser accept the shared single
    // sign-on cookie the API sets for *.ridearrivo.com on login/signup.
    return fetch(API_BASE_URL + path, Object.assign({ credentials: "include" }, options)).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { ok: res.ok, status: res.status, data: data };
      });
    });
  }

  // "next" is attacker-controllable (anyone can link to
  // login.html?next=<anything>) and gets assigned straight to
  // window.location.href after a real, successful login/signup -- an
  // unvalidated value here is an open redirect: a phishing link that
  // reads as trustworthy (it's really ridearrivo.com) which, right after
  // the visitor authenticates for real, bounces them to an attacker's
  // look-alike page primed to ask them to "log in again". Every legitimate
  // caller only ever passes a same-site page name or pathname+search (see
  // book.html, account.html, track.html, scan.html), so restrict to that
  // shape: no scheme (blocks "javascript:", "https://…"), no leading "//"
  // or backslash (both are browser-recognized ways to point at a
  // different host from what looks like a relative path).
  // Browsers throw away tabs, line breaks and leading spaces before reading a
  // URL, so testing the raw text is unsafe ("/<TAB>/evil.com" reads as a path
  // to a naive check, then as "//evil.com" to the browser). Let the browser's
  // own URL parser decide: resolve the value against this page, then follow it
  // only if it lands on this same site OR on one of OUR OWN sibling sites
  // (express./move./air./boat./membership.) so shared sign-in can send the
  // rider back where they came from. Exact host match, https only, no embedded
  // credentials -- never "anything under ridearrivo.com".
  var SSO_RETURN_HOSTS = ["ridearrivo.com", "www.ridearrivo.com", "express.ridearrivo.com",
    "move.ridearrivo.com", "boat.ridearrivo.com", "air.ridearrivo.com", "membership.ridearrivo.com"];
  function getNextUrl() {
    var next = new URLSearchParams(window.location.search).get("next");
    if (!next) return "account.html";
    try {
      var resolved = new URL(next, window.location.href);
      if (resolved.username || resolved.password) return "account.html";
      // Never "return" to the login page itself: a signed-in visitor would be
      // sent from login to login forever.
      if (/\/login(\.html)?\/?$/.test(resolved.pathname)) return "account.html";
      // Return the fully resolved href, never pathname+search+hash: a path
      // like "//evil.example/x" (e.g. a normalised double-slash pathname) would be
      // re-read by the browser as a different host when assigned later.
      if (resolved.origin === window.location.origin) {
        return resolved.href;
      }
      // Exact origin match (scheme + host + default port), not just hostname.
      if (resolved.protocol === "https:" && resolved.port === "" &&
          SSO_RETURN_HOSTS.indexOf(resolved.hostname) !== -1) {
        return resolved.href;
      }
      return "account.html";
    } catch (e) {
      return "account.html";
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    // Already logged in? Skip straight past this page.
    if (localStorage.getItem(TOKEN_KEY)) {
      window.location.href = getNextUrl();
      return;
    }

    var errEl = document.getElementById("loginError");
    var btn = document.getElementById("loginBtn");

    function attemptLogin() {
      var email = document.getElementById("fEmail").value.trim();
      var password = document.getElementById("fPassword").value;
      errEl.hidden = true;

      if (!email || !password) {
        errEl.hidden = false;
        errEl.textContent = RAt("auth.errBoth",RAt("auth.errBoth","Please enter your email and password."));
        return;
      }

      btn.disabled = true;
      btn.textContent = RAt("auth.loggingIn","Logging in…");

      api("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password }),
      }).then(function (result) {
        btn.disabled = false;
        btn.textContent = RAt("auth.logIn","Log in");
        if (!result.ok) {
          errEl.hidden = false;
          errEl.textContent = result.data.error || "Couldn't log in. Check your email and password.";
          return;
        }
        localStorage.setItem(TOKEN_KEY, result.data.token);
        window.location.href = getNextUrl();
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = RAt("auth.logIn","Log in");
        errEl.hidden = false;
        errEl.textContent = RAt("auth.errServer",RAt("auth.errServer","Couldn't reach the server. Please try again."));
      });
    }

    btn.addEventListener("click", attemptLogin);
    document.getElementById("fPassword").addEventListener("keydown", function (e) {
      if (e.key === "Enter") attemptLogin();
    });

    // ── Google / Apple sign-in ──
    // Login (unlike Signup) has no separate consent checkbox -- tapping
    // "Continue with Google/Apple" under the visible privacy notice below
    // IS the consent action, same pattern used in the rider/driver apps'
    // Login screens. agreedToTerms is still sent through and still enforced
    // server-side for any genuinely new account (routes/auth.js), so this
    // isn't a client-only formality.
    var oauthErrEl = document.getElementById("oauthError");

    function submitOAuth(path, payload) {
      oauthErrEl.hidden = true;
      api(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      }).then(function (result) {
        if (!result.ok) {
          var raw = (result.data && result.data.error) || "";
          if (/jwt|audience|client_id|APPLE_|GOOGLE_|configured|expected:/i.test(raw)) {
            // A setup problem on our side, not something the visitor can fix or should read.
            console.warn("OAuth setup error:", raw);
            raw = "";
            oauthErrEl.textContent = (path.indexOf("apple") !== -1 ? "Apple sign-in isn't available right now. " : "This sign-in isn't available right now. ") + "Please use your email and password" + (path.indexOf("apple") !== -1 ? " or Google" : "") + " instead.";
          } else {
            oauthErrEl.textContent = raw || "Couldn't sign you in. Please try again.";
          }
          oauthErrEl.hidden = false;
          return;
        }
        localStorage.setItem(TOKEN_KEY, result.data.token);
        window.location.href = getNextUrl();
      }).catch(function () {
        oauthErrEl.hidden = false;
        oauthErrEl.textContent = RAt("auth.errServer",RAt("auth.errServer","Couldn't reach the server. Please try again."));
      });
    }

    // Google Identity Services -- web Client ID (already whitelisted server-side
    // in GOOGLE_OAUTH_CLIENT_IDS alongside the mobile apps' iOS/Android ones).
    var GOOGLE_WEB_CLIENT_ID = "425853448895-r6ha3gh7b4i4lcsl3lohncuk3ecblsl3.apps.googleusercontent.com";

    function handleGoogleCredential(response) {
      submitOAuth("/api/auth/google", { idToken: response.credential, role: "rider", agreedToTerms: true });
    }

    // Google's renderButton takes a fixed pixel width, not a percentage --
    // hardcoding 300 overflowed the .auth-wrap/.booking-card padding on
    // narrow phones (as little as ~279px usable width at 375px viewport),
    // pushing the button past its container's edge. Deriving it from the
    // container's actual rendered width keeps it from ever being wider than
    // what's really available, on any screen size.
    function googleButtonWidth() {
      var container = document.getElementById("googleSignInBtn");
      return Math.max(200, Math.min(400, container.clientWidth || 300));
    }

    function initGoogleSignIn(attemptsLeft) {
      if (window.google && window.google.accounts && window.google.accounts.id) {
        google.accounts.id.initialize({ client_id: GOOGLE_WEB_CLIENT_ID, callback: handleGoogleCredential });
        google.accounts.id.renderButton(document.getElementById("googleSignInBtn"), {
          theme: (document.documentElement.getAttribute("data-theme") === "dark" ? "filled_black" : "outline"), size: "large", shape: "rectangular", text: "continue_with", width: googleButtonWidth(),
        });
      } else if (attemptsLeft > 0) {
        setTimeout(function () { initGoogleSignIn(attemptsLeft - 1); }, 150);
      }
    }
    initGoogleSignIn(40);

    // Sign in with Apple (web) -- needs a Services ID from Apple Developer
    // (separate from the app Bundle IDs used natively), configured with this
    // site's domain + a return URL, before it can go live. Left blank on
    // purpose: the button simply won't render until that's set up, so
    // nothing breaks in the meantime. Once you have it:
    //   1. Fill in APPLE_WEB_SERVICES_ID below with the Services ID string.
    //   2. Set APPLE_ADDITIONAL_CLIENT_IDS=com.ridearrivo.web on Render. The
    //      backend checks the token's audience against its trusted list; the
    //      two native iOS apps are built in, a web Services ID is added only
    //      through this variable. (APPLE_BUNDLE_IDS is deprecated and ignored.)
    var APPLE_WEB_SERVICES_ID = "com.ridearrivo.web";

    function handleAppleCredential(idToken) {
      submitOAuth("/api/auth/apple", { identityToken: idToken, role: "rider", agreedToTerms: true });
    }

    function initAppleSignIn(attemptsLeft) {
      if (!APPLE_WEB_SERVICES_ID) return; // not configured yet -- button stays hidden
      if (window.AppleID) {
        AppleID.auth.init({
          clientId: APPLE_WEB_SERVICES_ID,
          scope: "name email",
          redirectURI: window.location.origin + "/login.html",
          usePopup: true,
        });
        var appleBtn = document.getElementById("appleSignInBtn");
        appleBtn.style.display = "flex";
        appleBtn.addEventListener("click", function () {
          AppleID.auth.signIn().then(function (res) {
            handleAppleCredential(res.authorization.id_token);
          }).catch(function () { /* user cancelled -- no error needed */ });
        });
      } else if (attemptsLeft > 0) {
        setTimeout(function () { initAppleSignIn(attemptsLeft - 1); }, 150);
      }
    }
    initAppleSignIn(40);
  });
</script>
